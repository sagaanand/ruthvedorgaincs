version: '3.8'

services:
  # ------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ruthved_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ruthved_organic
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ruthved_organic']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ruthved_network

  # ------------------------------------------------------------
  # 2. Redis Cache & Job Queue Service
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ruthved_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ruthved_network

  # ------------------------------------------------------------
  # 3. Ruthved Organic Express Backend API Service
  # ------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruthved_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/ruthved_organic?schema=public
      REDIS_URL: redis://redis:6379
      ENABLE_REDIS_JOBS: 'true'
      APP_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      JWT_ACCESS_SECRET: ruthved_production_jwt_access_secret_key_9876543210
      JWT_REFRESH_SECRET: ruthved_production_jwt_refresh_secret_key_1234567890
      COOKIE_SECRET: ruthved_production_cookie_secret_key_1357924680
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-rzp_webhook_secret_placeholder}
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ruthved_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  ruthved_network:
    driver: bridge
